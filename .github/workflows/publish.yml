name: Publish release

# Publishes @artymclabin/gmail-mcp everywhere when a v* tag is pushed:
# npm -> official MCP Registry (OIDC) -> Smithery (.mcpb bundle).
# Secrets: NPM_TOKEN, SMITHERY_API_KEY.
on:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write # OIDC auth for the MCP Registry

jobs:
  npm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'
      - run: npm ci
      - run: npm test
      - run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  mcp-registry:
    needs: npm
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Install mcp-publisher
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher
      - name: Authenticate to MCP Registry (OIDC)
        run: ./mcp-publisher login github-oidc
      - name: Publish to MCP Registry
        run: ./mcp-publisher publish

  smithery:
    needs: npm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run build
      - name: Assemble .mcpb bundle
        run: |
          VERSION=$(node -p "require('./package.json').version")
          mkdir bundle
          cp -r dist package.json README.md LICENSE bundle/
          jq --arg v "$VERSION" '.version = $v' mcpb-manifest.json > bundle/manifest.json
          cd bundle && npm install --omit=dev --ignore-scripts
      - name: Pack bundle
        run: |
          npx --yes @anthropic-ai/mcpb validate bundle/manifest.json
          npx --yes @anthropic-ai/mcpb pack bundle gmail-mcp.mcpb
      - name: Publish to Smithery
        run: |
          npm install -g smithery@latest
          smithery mcp publish ./gmail-mcp.mcpb -n rawceo/gmail-mcp
        env:
          SMITHERY_API_KEY: ${{ secrets.SMITHERY_API_KEY }}
